<div class="campo">
  <!-- Etiqueta siempre visible, como en el campo de texto y por lo mismo. -->
  <label class="etiqueta tipo-secundario" [for]="fieldId()">{{ labelKey() | transloco }}</label>

  @if (hintKey(); as pista) {
    <p class="pista tipo-leyenda" [id]="hintId()">{{ pista | transloco }}</p>
  }

  <select
    class="entrada"
    [id]="fieldId()"
    [formControl]="control()"
    [attr.aria-invalid]="errorKey() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
  >
    <!-- La opcion vacia existe para que el campo pueda estar sin elegir y para que un
         lector de pantalla anuncie que hay que elegir, en vez de leer el primer valor de
         la lista como si ya estuviera puesto. -->
    <option value="">{{ placeholderKey() | transloco }}</option>
    @for (opcion of options(); track opcion.code) {
      <option [value]="opcion.code">{{ opcion.name }}</option>
    }
  </select>

  @if (errorKey(); as error) {
    <p class="error tipo-leyenda" [id]="errorId()" role="alert">{{ error | transloco }}</p>
  }
</div>
