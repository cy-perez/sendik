<!-- Unica llamada a la accion de la pantalla, y siempre como relleno en tinta
     con texto claro encima. En Sendik el boton principal va en tinta y nunca en
     bronce, que esta reservado a lo verificado. -->
<button
  type="submit"
  class="btn-primario boton-envio tipo-etiqueta-boton"
  [disabled]="loading()"
  [attr.aria-busy]="loading() ? 'true' : null"
>
  {{ labelKey() | transloco }}
  @if (loading()) {
    <span class="indicador" aria-hidden="true"></span>
    <span class="solo-lectores">{{ loadingLabelKey() | transloco }}</span>
  }
</button>
