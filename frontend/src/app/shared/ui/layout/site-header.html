<!-- Primer elemento enfocable de la pagina: quien navega con teclado salta el
     encabezado y llega al contenido de la ruta. -->
<a class="salto-al-contenido" href="#contenido">{{ 'layout.skipToContent' | transloco }}</a>

<!-- El keydown no esta aqui sino en el host del componente (site-header.ts): tiene
     que alcanzar la cabecera entera, porque Escape debe funcionar tambien con el
     foco en el boton, que vive fuera del panel. Ponerlo en este `header` obliga
     a hacerlo enfocable, y un contenedor que entra en el orden de tabulacion es
     una parada de mas para quien navega con teclado. -->
<header class="cabecera">
  <div class="contenedor barra">
    <!-- El nombre accesible vive en el enlace. Las cuatro imagenes llevan alt
         vacio para que el lector de pantalla no anuncie "Sendik" cuatro veces;
         marca.css alterna claro/oscuro segun el tema y esta hoja alterna
         lockup/isotipo segun el ancho.

         El lockup tiene un minimo de 130px de ancho (manual de marca): por
         debajo, el corte del simbolo se cierra y la palabra se empasta. A 34px
         de alto mide 169px, asi que en escritorio cabe holgado; en movil se
         reduce al isotipo para dejarle el ancho al buscador, que es la accion
         mas usada de la cabecera en un marketplace. -->
    <a class="logo-sitio" routerLink="/" [attr.aria-label]="'layout.logoAlt' | transloco">
      <img class="logo-claro lockup" src="/logo-horizontal.svg" alt="" width="169" height="34" />
      <img
        class="logo-oscuro lockup"
        src="/logo-mono-negativo.svg"
        alt=""
        width="169"
        height="34"
      />
      <img class="logo-claro isotipo" src="/isotipo.svg" alt="" width="32" height="32" />
      <img class="logo-oscuro isotipo" src="/isotipo-negativo.svg" alt="" width="32" height="32" />
    </a>

    <!-- Solo se ve por debajo de 640px. aria-expanded es lo que le dice al lector
         de pantalla si lo que controla esta desplegado o no.

         Los cuatro iconos de esta cabecera llevan `.icono` y ningun atributo de
         trazo propio. La clase vive en marca.css y es la reticula del manual:
         area viva de 20 sobre lienzo de 24, trazo de 2 y terminaciones RECTAS
         (butt/miter), que es la misma decision que los cortes rectos del
         isotipo. Iban con stroke-width suelto de 1.75 y terminaciones por
         omision, asi que el unico set de iconos del sitio era el que no seguia
         la regla. Un atributo de presentacion no compite con la clase: el CSS
         gana, de modo que dejarlos solo confundiria sobre donde se decide. -->
    <button
      #boton
      type="button"
      class="boton-icono boton-menu"
      aria-controls="menu-principal"
      [attr.aria-expanded]="abierto()"
      [attr.aria-label]="menuLabelKey() | transloco"
      (click)="alternarMenu()"
    >
      @if (abierto()) {
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      } @else {
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      }
    </button>

    <!-- Un solo panel para los dos tamanos: en escritorio es una fila, en movil
         se despliega. No se duplican los enlaces porque el HTML servido tendria
         cada pagina dos veces y el buscador ve dos navegaciones donde hay una. -->
    <div #panel id="menu-principal" class="panel" [class.desplegado]="abierto()">
      <!-- aria-label porque hay mas de un nav en la pagina: este y los dos del
           pie. Sin distinguirlos, un lector anuncia tres "navegacion" iguales. -->
      <nav class="navegacion" [attr.aria-label]="'layout.nav.label' | transloco">
        <ul class="lista-nav" role="list">
          @for (pagina of paginas; track pagina) {
            <li>
              <a
                class="enlace-nav tipo-secundario"
                [routerLink]="rutaDe(pagina)"
                routerLinkActive="activo"
                ariaCurrentWhenActive="page"
                (click)="cerrarMenu()"
              >
                {{ 'layout.nav.pages.' + pagina | transloco }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>

    <!-- Fuera del panel a proposito: idioma, tema y sesion no son navegacion.
         Dentro quedaban escondidos tras la hamburguesa por debajo de 640px, y
         lo que HU-005 sustituye por el menu compacto son los enlaces, no los
         controles con los que alguien entra o cambia de idioma. -->
    <div class="acciones">
      <label class="solo-lectores" for="language-picker">
        {{ 'layout.language.label' | transloco }}
      </label>
      <select
        id="language-picker"
        class="selector-idioma"
        [value]="currentLocale()"
        (change)="onLanguageChange($event)"
      >
        @for (locale of locales(); track locale) {
          <option [value]="locale">{{ 'layout.language.' + locale | transloco }}</option>
        }
      </select>

      <button
        type="button"
        class="boton-icono"
        [attr.aria-label]="themeLabelKey() | transloco"
        [attr.aria-pressed]="currentTheme() === 'dark'"
        (click)="toggleTheme()"
      >
        @if (currentTheme() === 'dark') {
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
            />
          </svg>
        } @else {
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" />
          </svg>
        }
      </button>

      <!-- Lo de la sesion llega proyectado desde app.html. La cabecera es de
           shared y no puede depender de la funcionalidad de cuentas; con
           ng-content ofrece el sitio sin tener que saber que se pone ahi. -->
      <ng-content />
    </div>
  </div>
</header>
