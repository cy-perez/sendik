@if (sesion.status() === 'desconocida') {
  <!-- Todavia no se sabe si hay sesion: el token vive en memoria y se pierde al
       recargar, asi que hay que preguntarle al servidor con la cookie. Pintar
       "Entrar" mientras tanto le cambiaria el boton bajo el cursor a quien si
       tiene sesion. El hueco mide lo mismo que lo que va a ocupar despues, para
       que la barra no se mueva. -->
  <span class="esqueleto inline-block h-touch w-[76px] rounded-md" aria-hidden="true"></span>
} @else if (sesion.user(); as usuario) {
  <!-- El nombre es el enlace a la propia cuenta: dice de quien es la sesion y
       lleva a donde se administra. Por eso ya no se oculta en movil, como cuando
       era solo una etiqueta; se recorta el texto y el control se queda. -->
  <a
    sendikButton
    variant="ghost"
    class="tipo-secundario max-w-[12ch] overflow-hidden text-ellipsis whitespace-nowrap sm:max-w-[20ch]"
    routerLink="/mi-cuenta"
    >{{ usuario.displayName }}</a
  >

  <button
    type="button"
    sendikButton
    variant="ghost"
    class="tipo-secundario"
    [disabled]="cierre.isPending()"
    (click)="salir()"
  >
    {{ 'layout.session.logout' | transloco }}
  </button>
} @else {
  <a sendikButton variant="ghost" class="tipo-secundario" routerLink="/ingresar">
    {{ 'layout.session.login' | transloco }}
  </a>
}
