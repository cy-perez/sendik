@if (visible()) {
  <!-- El landmark se queda en el aside. Ponerle role="status" lo sustituiria por
       una region viva y este bloque, con su boton, dejaria de pertenecer a
       ninguna region de la pagina: ni banner, ni main, ni complementary. La
       region viva es la de mas abajo, que es lo unico que de verdad cambia. -->
  <aside
    class="border-b border-border bg-surface text-text"
    [attr.aria-label]="'auth.pending.label' | transloco"
  >
    <div
      class="contenedor flex flex-wrap items-center gap-x-3 gap-y-0 border-l-4 border-warning py-3"
    >
      <p class="tipo-cuerpo">{{ 'auth.pending.body' | transloco }}</p>

      <!-- Ni se deshabilita ni se sustituye por el mensaje de exito. Las dos
           cosas se llevan por delante el foco de quien acaba de pulsarlo con el
           teclado y lo devuelven al principio del documento. Se queda donde
           esta, anuncia que trabaja con aria-busy, y el doble envio lo corta el
           propio manejador. -->
      <button
        type="button"
        sendikButton
        variant="ghost"
        class="tipo-secundario"
        [attr.aria-busy]="reenvio.isPending() ? 'true' : null"
        (click)="reenviar()"
      >
        {{ 'auth.pending.resend' | transloco }}
      </button>

      <!-- Las dos regiones existen siempre, aunque esten vacias. Una region viva
           que nace ya con su texto dentro no se anuncia: el lector de pantalla
           avisa de lo que cambia en una region que ya estaba, no de la aparicion
           de la region entera. -->
      <p class="tipo-secundario m-0 basis-full" [class.mt-2]="reenvio.isSuccess()" role="status">
        @if (reenvio.isSuccess()) {
          {{ 'auth.pending.resent' | transloco }}
        }
      </p>

      <p
        class="tipo-secundario m-0 basis-full text-error"
        [class.con-texto]="errorDelReenvio() !== null"
        role="alert"
      >
        @if (errorDelReenvio(); as fallo) {
          {{ fallo | transloco }}
        }
      </p>
    </div>
  </aside>
}
