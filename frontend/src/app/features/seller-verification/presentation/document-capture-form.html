<form
  class="mt-6 flex max-w-form flex-col gap-4"
  [formGroup]="form"
  (ngSubmit)="guardar()"
  novalidate
>
  @if (errorDelServidor(); as error) {
    <p class="tipo-cuerpo text-error" role="alert">{{ error | transloco }}</p>
  } @else if (envio.isSuccess()) {
    <p class="tipo-cuerpo text-success" role="status">
      {{ 'sellerVerification.documentForm.saved' | transloco }}
    </p>
  }

  <div class="flex flex-col gap-1">
    <label class="tipo-secundario text-text" for="tipo-de-documento">
      {{ 'sellerVerification.documentForm.type' | transloco }}
    </label>

    <select
      id="tipo-de-documento"
      class="control-field tipo-cuerpo"
      formControlName="tipo"
      [attr.aria-invalid]="errorDeTipo() ? 'true' : null"
      [attr.aria-describedby]="errorDeTipo() ? 'tipo-de-documento-error' : null"
    >
      <option value="">{{ 'sellerVerification.documentForm.type' | transloco }}</option>
      @for (tipo of tipos; track tipo) {
        <option [value]="tipo">
          {{ 'sellerVerification.documentForm.types.' + tipo | transloco }}
        </option>
      }
    </select>

    @if (errorDeTipo(); as error) {
      <p id="tipo-de-documento-error" class="tipo-secundario text-error">
        {{ error | transloco }}
      </p>
    }
  </div>

  <sendik-text-field
    fieldId="numero-de-documento"
    autocomplete="off"
    [label]="'sellerVerification.documentForm.number' | transloco"
    [control]="control('numero')"
    [error]="errorDeNumero() ? (errorDeNumero() | transloco) : null"
  />

  <sendik-text-field
    fieldId="titular-del-documento"
    autocomplete="name"
    [label]="'sellerVerification.documentForm.holder' | transloco"
    [control]="control('titular')"
    [error]="errorDeTitular() ? (errorDeTitular() | transloco) : null"
  />

  <!-- Las dos caras. Cada campo emite su foto solo cuando pasa el umbral de nitidez,
       asi que aqui no llega nada borroso. -->
  <sendik-capture-field
    encuadre="documento"
    labelKey="sellerVerification.documentForm.front"
    (capturada)="frente.set($event)"
  />

  <sendik-capture-field
    encuadre="documento"
    labelKey="sellerVerification.documentForm.back"
    (capturada)="reverso.set($event)"
  />

  @if (errorDeFotos(); as error) {
    <p class="tipo-secundario text-error" role="alert">{{ error | transloco }}</p>
  }

  <sendik-submit-button
    [label]="'sellerVerification.documentForm.submit' | transloco"
    [loadingLabel]="'form.sending' | transloco"
    [loading]="envio.isPending()"
  />
</form>
