<form class="formulario" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
  @if (errorDelServidor(); as error) {
    <p class="error tipo-cuerpo" role="alert">{{ error | transloco }}</p>
  } @else if (envio.isSuccess()) {
    <p class="guardado tipo-cuerpo" role="status">
      {{ 'sellerVerification.documentForm.saved' | transloco }}
    </p>
  }

  <div class="campo">
    <label class="etiqueta tipo-secundario" for="tipo-de-documento">
      {{ 'sellerVerification.documentForm.type' | transloco }}
    </label>

    <select
      id="tipo-de-documento"
      class="control tipo-cuerpo"
      formControlName="tipo"
      [attr.aria-invalid]="errorDeTipo() ? 'true' : null"
      [attr.aria-describedby]="errorDeTipo() ? 'tipo-de-documento-error' : null"
    >
      <option value="">{{ 'sellerVerification.documentForm.type' | transloco }}</option>
      @for (tipo of tipos; track tipo) {
        <option [value]="tipo">
          {{ 'sellerVerification.documentForm.types.' + tipo | transloco }}
        </option>
      }
    </select>

    @if (errorDeTipo(); as error) {
      <p id="tipo-de-documento-error" class="error-campo tipo-secundario">
        {{ error | transloco }}
      </p>
    }
  </div>

  <sendik-text-field
    fieldId="numero-de-documento"
    autocomplete="off"
    labelKey="sellerVerification.documentForm.number"
    [control]="control('numero')"
    [errorKey]="errorDeNumero()"
  />

  <sendik-text-field
    fieldId="titular-del-documento"
    autocomplete="name"
    labelKey="sellerVerification.documentForm.holder"
    [control]="control('titular')"
    [errorKey]="errorDeTitular()"
  />

  <!-- Las dos caras. Cada campo emite su foto solo cuando pasa el umbral de nitidez,
       asi que aqui no llega nada borroso. -->
  <sendik-capture-field
    encuadre="documento"
    labelKey="sellerVerification.documentForm.front"
    (capturada)="frente.set($event)"
  />

  <sendik-capture-field
    encuadre="documento"
    labelKey="sellerVerification.documentForm.back"
    (capturada)="reverso.set($event)"
  />

  @if (errorDeFotos(); as error) {
    <p class="error-campo tipo-secundario" role="alert">{{ error | transloco }}</p>
  }

  <sendik-submit-button
    labelKey="sellerVerification.documentForm.submit"
    [loading]="envio.isPending()"
  />
</form>
