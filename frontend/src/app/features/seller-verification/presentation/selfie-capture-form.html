<div class="mt-6 flex max-w-form flex-col gap-4">
  @if (errorDelServidor(); as error) {
    <p class="tipo-cuerpo text-error" role="alert">{{ error | transloco }}</p>
  } @else if (envio.isSuccess()) {
    <p class="tipo-cuerpo text-success" role="status">
      {{ 'sellerVerification.selfieForm.saved' | transloco }}
    </p>
  }

  <sendik-capture-field
    encuadre="rostro"
    labelKey="sellerVerification.steps.selfie.title"
    (capturada)="foto.set($event)"
  />

  @if (errorDeFoto(); as error) {
    <p class="tipo-secundario text-error" role="alert">{{ error | transloco }}</p>
  }

  <button
    type="button"
    sendikButton
    variant="ghost"
    class="tipo-secundario"
    [disabled]="envio.isPending()"
    (click)="guardar()"
  >
    {{ 'sellerVerification.selfieForm.submit' | transloco }}
  </button>
</div>
