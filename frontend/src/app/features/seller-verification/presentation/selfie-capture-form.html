<!-- Un formulario con su boton de envio, como los del documento y la cuenta: el boton
     de antes llevaba una clase que esta hoja no define y se pintaba con el aspecto del
     navegador, a 27px de alto. -->
<form class="formulario" (submit)="guardar($event)" novalidate>
  @if (errorDelServidor(); as error) {
    <p class="error tipo-cuerpo" role="alert">{{ error | transloco }}</p>
  } @else if (envio.isSuccess()) {
    <p class="guardado tipo-cuerpo" role="status">
      {{ 'sellerVerification.selfieForm.saved' | transloco }}
    </p>
  }

  <sendik-capture-field
    encuadre="rostro"
    labelKey="sellerVerification.steps.selfie.title"
    (capturada)="foto.set($event)"
  />

  @if (errorDeFoto(); as error) {
    <p class="error-campo tipo-secundario" role="alert">{{ error | transloco }}</p>
  }

  <sendik-submit-button
    labelKey="sellerVerification.selfieForm.submit"
    [loading]="envio.isPending()"
  />
</form>
