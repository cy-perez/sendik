<sendik-site-header>
  <sendik-session-menu />
</sendik-site-header>

<!-- Va fuera del main y antes de el: es un estado de la cuenta que acompana a
     todas las pantallas, no contenido de la que se este mirando. -->
<sendik-verification-notice />

<!-- tabindex="-1" es lo que hace que el enlace de salto mueva el foco de verdad
     y no solo el desplazamiento. Sin el, el teclado sigue en la cabecera. -->
<main id="contenido" class="contenido" tabindex="-1">
  <!-- El componente de la ruta se inserta como HERMANO de <router-outlet>, no
       dentro. El propio outlet no pinta nada, pero es hijo directo de la rejilla
       de carriles y consumiria una fila: display:contents lo saca del flujo sin
       sacar a su hermano. -->
  <router-outlet class="contents" />
</main>

<sendik-site-footer />
