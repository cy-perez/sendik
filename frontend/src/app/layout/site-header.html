<!-- Primer elemento enfocable de la pagina: quien navega con teclado salta el
     encabezado y llega al contenido de la ruta.

     No se oculta con hidden ni con display:none, porque entonces el teclado
     tampoco lo alcanzaria: se saca de la vista con una traslacion y vuelve al
     recibir el foco. -->
<a
  class="absolute left-2 top-2 z-10 -translate-y-[250%] rounded-md border border-border bg-surface px-4 py-2 text-text no-underline focus:translate-y-0"
  href="#contenido"
>
  {{ 'layout.skipToContent' | transloco }}
</a>

<!-- El keydown no esta aqui sino en el host del componente (site-header.ts): tiene
     que alcanzar la cabecera entera, porque Escape debe funcionar tambien con el
     foco en el boton, que vive fuera del panel. Ponerlo en este `header` obliga
     a hacerlo enfocable, y un contenedor que entra en el orden de tabulacion es
     una parada de mas para quien navega con teclado. -->
<header class="sticky top-0 z-5 border-b border-border bg-surface">
  <!-- min-h y no h: con el texto al 200% la barra crece en vez de recortar.
       56 en movil y 72 en escritorio, medidas del kit. -->
  <!-- La region del foco atrapado es esta barra entera, no el panel: el idioma,
       el tema y la sesion se ven en movil y viven fuera del panel, asi que con el
       ciclo limitado al panel eran inalcanzables con teclado. autoCapture queda
       en falso a proposito: al abrir, el foco se queda en el boton, que ya esta
       dentro de la region. -->
  <div
    [cdkTrapFocus]="atrapaFoco()"
    class="contenedor flex min-h-header-mobile flex-wrap items-center justify-between gap-4 sm:min-h-header"
  >
    <!-- El nombre accesible vive en el enlace. Las cuatro imagenes llevan alt
         vacio para que el lector de pantalla no anuncie "Sendik" cuatro veces.

         Cual de las cuatro se ve depende de dos ejes: tema y ancho. El ancho lo
         decide Tailwind con sm:. El tema lo decide el componente con una clase
         calculada, y NO con la variante dark:, por una razon que ya costo una
         vez: la version anterior tenia que poner esta regla en marca.css porque
         la encapsulacion emulada de Angular anadia [_ngcontent-x] a todos los
         compuestos del selector, incluido el [data-tema] del <html>, y la regla
         no casaba nunca. Resolverlo en TypeScript deja la decision a la vista y
         no depende de en que hoja acabe la regla. -->
    <a
      class="logo-sitio inline-flex items-center"
      routerLink="/"
      [attr.aria-label]="'layout.logoAlt' | transloco"
    >
      <img [class]="claseLockup()" src="/logo-horizontal.svg" alt="" width="169" height="34" />
      <img
        [class]="claseLockupOscuro()"
        src="/logo-mono-negativo.svg"
        alt=""
        width="169"
        height="34"
      />
      <img [class]="claseIsotipo()" src="/isotipo.svg" alt="" width="32" height="32" />
      <img
        [class]="claseIsotipoOscuro()"
        src="/isotipo-negativo.svg"
        alt=""
        width="32"
        height="32"
      />
    </a>

    <!-- Solo existe por debajo de 640px, y se oculta con display para que en
         escritorio tampoco lo alcance el tabulador: un boton invisible que
         recibe el foco deja a quien navega con teclado sin saber donde esta.
         aria-expanded es lo que le dice al lector si lo que controla esta
         desplegado. -->
    <button
      #boton
      type="button"
      class="inline-flex min-h-touch min-w-touch cursor-pointer items-center justify-center rounded-md border border-control-border bg-surface p-0 text-text hover:bg-primary-soft sm:hidden"
      aria-controls="menu-principal"
      [attr.aria-expanded]="abierto()"
      [attr.aria-label]="menuLabelKey() | transloco"
      (click)="alternarMenu()"
    >
      <sendik-icon [icon]="abierto() ? iconoCerrar : iconoMenu" />
    </button>

    <!-- Un solo panel para los dos tamanos: en escritorio es una fila, en movil
         se despliega. No se duplican los enlaces porque el HTML servido tendria
         cada pagina dos veces y el buscador ve dos navegaciones donde hay una.

         El `order-1` lo baja por debajo de las acciones: el panel es w-full, asi
         que rompe fila, y sin eso al abrir el menu los controles de idioma, tema
         y sesion se iban de un salto a una tercera fila. En escritorio vuelve al
         orden del documento. -->
    <div
      id="menu-principal"
      class="panel order-1 w-full flex-col gap-4 pb-4 sm:order-0 sm:flex sm:w-auto sm:flex-row sm:flex-wrap sm:items-center sm:justify-end sm:gap-6 sm:pb-0"
      [class.flex]="abierto()"
      [class.hidden]="!abierto()"
    >
      <!-- aria-label porque hay mas de un nav en la pagina: este y los dos del
           pie. Sin distinguirlos, un lector anuncia tres "navegacion" iguales. -->
      <nav [attr.aria-label]="'layout.nav.label' | transloco">
        <!-- role="list" devuelve el rol que WebKit le quita a un ul sin vinetas. -->
        <ul
          class="m-0 flex list-none flex-col gap-1 p-0 sm:flex-row sm:items-center sm:gap-2"
          role="list"
        >
          @for (pagina of paginas; track pagina) {
            <li>
              <a
                class="enlace-nav tipo-secundario flex min-h-touch items-center rounded-md px-2 text-text no-underline hover:bg-primary-soft"
                [routerLink]="rutaDe(pagina)"
                routerLinkActive="underline underline-offset-4 decoration-2"
                ariaCurrentWhenActive="page"
                (click)="cerrarMenu()"
              >
                {{ 'layout.nav.pages.' + pagina | transloco }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>

    <!-- Fuera del panel a proposito: idioma, tema y sesion no son navegacion.
         Dentro quedaban escondidos tras la hamburguesa por debajo de 640px, y
         lo que HU-005 sustituye por el menu compacto son los enlaces, no los
         controles con los que alguien entra o cambia de idioma.

         Envuelve igual que la barra: con el hueco proyectado son tres controles,
         y con el texto al 200% la fila no cabe en un movil. Sin wrap eso saca
         una barra de desplazamiento horizontal en una cabecera pegajosa. -->
    <div class="flex flex-wrap items-center gap-2">
      <label class="solo-lectores" for="language-picker">
        {{ 'layout.language.label' | transloco }}
      </label>
      <select
        id="language-picker"
        class="min-h-touch rounded-md border border-control-border bg-surface px-2 text-text"
        [value]="currentLocale()"
        (change)="onLanguageChange($event)"
      >
        @for (locale of locales(); track locale) {
          <option [value]="locale">{{ 'layout.language.' + locale | transloco }}</option>
        }
      </select>

      <button
        type="button"
        class="inline-flex min-h-touch min-w-touch cursor-pointer items-center justify-center rounded-md border border-control-border bg-surface p-0 text-text hover:bg-primary-soft"
        [attr.aria-label]="themeLabelKey() | transloco"
        [attr.aria-pressed]="currentTheme() === 'dark'"
        (click)="toggleTheme()"
      >
        <sendik-icon [icon]="currentTheme() === 'dark' ? iconoSol : iconoLuna" />
      </button>

      <!-- Lo de la sesion llega proyectado desde app.html. La cabecera no puede
           depender de la funcionalidad de cuentas; con ng-content ofrece el sitio
           sin tener que saber que se pone ahi. -->
      <ng-content />
    </div>
  </div>
</header>
