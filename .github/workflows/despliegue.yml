# Despliegue (docs/operacion/entornos.md).
#
# Las dos piezas van a Cloud Run, en la misma region y desde el mismo commit
# verificado: el backend en Java y el frontend con renderizado en servidor en Node
# (ADR-0024). GoDaddy es el registrador de sendik.co y sirve el DNS; no ejecuta
# nada.
#
#   rama de trabajo -> pull request -> verificación -> main -> dev automático
#                                                          -> prod con etiqueta y aprobación
#
# Nada se despliega sin pasar antes la verificación completa: este flujo la
# **llama** en lugar de repetir sus pasos, para que no puedan separarse con el
# tiempo y acabe publicándose algo que pasó una revisión más floja que la de un
# pull request.
#
# Los secretos no pasan por aquí. Cloud Run los lee de Secret Manager y GitHub
# solo dice qué secreto va en qué variable: así el registro de una ejecución no
# puede contener una contraseña, y rotar una no obliga a tocar el repositorio.
# La autenticación contra Google es por federación de identidades, sin ninguna
# clave JSON guardada. Lo que hay que crear una sola vez está en
# docs/operacion/despliegue.md.

name: Despliegue

on:
  push:
    branches: [main]
    tags: ['v*']

# Un despliegue no se cancela a medias: dejaría una revisión a medio publicar.
concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Necesario para pedir el token de federación de identidades a GitHub.
  id-token: write

jobs:
  verificar:
    name: Verificación previa
    uses: ./.github/workflows/verificacion.yml

  # Decide a qué entorno va esto. Una etiqueta de versión va a producción; un
  # empujón a main, a desarrollo. Se calcula en un trabajo aparte porque `if` no
  # puede definir un `environment`, y porque los dos despliegues —backend y
  # frontend— necesitan la misma decisión sin repetirla.
  destino:
    name: Destino
    needs: verificar
    runs-on: ubuntu-latest
    outputs:
      entorno: ${{ steps.decidir.outputs.entorno }}
      etiqueta: ${{ steps.decidir.outputs.etiqueta }}
    steps:
      - id: decidir
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "entorno=prod" >> "$GITHUB_OUTPUT"
            echo "etiqueta=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "entorno=dev" >> "$GITHUB_OUTPUT"
            echo "etiqueta=main-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

  # Avisa, una sola vez y en verde, de que no hay nada configurado. Sin esto, la
  # única señal sería un trabajo omitido sin explicación, y quien mire la ejecución
  # no sabría si se saltó a propósito o por un error del flujo.
  sin-configurar:
    name: Sin configurar
    needs: destino
    if: vars.GCP_PROJECT_ID == ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::Falta configurar el proyecto de Google Cloud."
          echo "El flujo está completo y la verificación ya pasó, pero sin GCP_PROJECT_ID"
          echo "no hay dónde publicar. Hacen falta el proyecto de Google Cloud, la base"
          echo "gestionada, los secretos, la federación de identidades y las variables de"
          echo "los dos servicios de Cloud Run. El procedimiento, en orden, está en:"
          echo "  docs/operacion/despliegue.md"

  backend:
    name: Backend en Cloud Run
    needs: [verificar, destino]
    # Se omite mientras no haya proyecto de Google Cloud configurado.
    #
    # Sin esta condición, cada integración a `main` deja una ejecución roja: el
    # paso de autenticación falla porque no existen las variables. Y una
    # canalización que está roja siempre deja de leerse, con lo cual el día que se
    # rompa de verdad nadie lo va a notar. Omitido dice la verdad —no hay dónde
    # desplegar— sin gastar la señal de alarma.
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # El entorno `prod` lleva revisores obligatorios configurados en GitHub: es
    # ahí donde vive la aprobación manual, no en un `if` de este archivo. Un
    # archivo se cambia en un commit; un revisor obligatorio, no.
    environment: ${{ needs.destino.outputs.entorno }}

    steps:
      - uses: actions/checkout@v7

      - name: Autenticarse en Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Preparar el acceso a Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Construir y publicar la imagen
        env:
          IMAGEN: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sendik/backend
        run: |
          docker build -t "$IMAGEN:${{ needs.destino.outputs.etiqueta }}" backend
          docker push "$IMAGEN:${{ needs.destino.outputs.etiqueta }}"

      # Flyway migra al arrancar la revisión nueva, y Cloud Run no le manda
      # tráfico hasta que su chequeo de estado responde. Por eso el orden que pide
      # entornos.md —migrar antes de servir— se cumple sin un paso aparte, y por
      # eso toda migración tiene que seguir siendo compatible hacia atrás: durante
      # el cambio conviven la revisión vieja y la nueva.
      #
      # Las dos claves de cifrado son tan obligatorias como la de firma: sin ellas
      # `AesGcmSensitiveDataCipher` no se construye y la aplicación no arranca. Estaban
      # documentadas como obligatorias en docs/operacion/configuracion.md y no las
      # pasaba nadie, así que este despliegue moría al iniciar. No se veía porque los
      # dos trabajos se omiten mientras no haya proyecto de Google Cloud.
      #
      # Lo vigila el trabajo «Ensayo del despliegue» de verificacion.yml, que arranca
      # esta misma imagen con el perfil `dev` y esta misma lista de variables: si aquí
      # falta una obligatoria, allí el contenedor no levanta y el pull request se pone
      # rojo antes de integrar.
      #
      # Las tres banderas de la Fase 2 y el moderador de arranque se pasan desde aquí, y
      # es lo que permite que `dev` y `prod` se decidan por separado: el valor lo pone la
      # variable del entorno de GitHub, no este archivo. **Van juntas a propósito.**
      # Encender `publishing` sin `SECURITY_BOOTSTRAP_MODERATORS` deja el entorno en un
      # callejón sin salida —se puede publicar y nada puede salir de `PENDING_REVIEW`,
      # porque no hay nadie con el rol para aprobarlo—, que es justo el hueco que HU-008
      # vino a cerrar.
      #
      # Con respaldo explícito y no a secas: una variable que no existe se expande a
      # cadena vacía, y ahí `${FEATURE_CATALOG:false}` no vale de nada porque el valor
      # por omisión solo entra cuando la variable no está definida, no cuando está
      # definida y vacía. Un booleano vacío tumba el arranque al enlazarlo.
      #
      # `VERIFICATION_REVIEW_DAYS` se pasaba solo al frontend, y el backend se quedaba con
      # su valor por omisión: la pantalla lo dice y el correo de «recibimos tu solicitud»
      # también, así que podían decir números distintos sin que nada fallara.
      #
      # `LISTING_REVIEW_DAYS` no está aquí y no es un olvido: hoy solo lo dice la pantalla,
      # porque enviar a revisión no manda ningún correo. Declararlo en el backend sería
      # configuración que nadie lee (docs/operacion/configuracion.md).
      - name: Desplegar la revisión
        env:
          IMAGEN: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sendik/backend
        run: |
          gcloud run deploy ${{ vars.CLOUD_RUN_SERVICE }} \
            --image "$IMAGEN:${{ needs.destino.outputs.etiqueta }}" \
            --region ${{ vars.GCP_REGION }} \
            --platform managed \
            --port 8080 \
            --min-instances ${{ vars.CLOUD_RUN_MIN_INSTANCES }} \
            --max-instances ${{ vars.CLOUD_RUN_MAX_INSTANCES }} \
            --memory ${{ vars.CLOUD_RUN_MEMORY }} \
            --service-account ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --set-env-vars "SPRING_PROFILES_ACTIVE=${{ needs.destino.outputs.entorno }}" \
            --set-env-vars "APP_BASE_URL=${{ vars.APP_BASE_URL }}" \
            --set-env-vars "APP_API_BASE_URL=${{ vars.APP_API_BASE_URL }}" \
            --set-env-vars "^;^CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}" \
            --set-env-vars "SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}" \
            --set-env-vars "^;^COMPANY_NAME=${{ vars.COMPANY_NAME }}" \
            --set-env-vars "COMPANY_TAX_ID=${{ vars.COMPANY_TAX_ID }}" \
            --set-env-vars "^;^COMPANY_ADDRESS=${{ vars.COMPANY_ADDRESS }}" \
            --set-env-vars "COMMISSION_RATE=${{ vars.COMMISSION_RATE }}" \
            --set-env-vars "MAIL_PROVIDER=resend" \
            --set-env-vars "MAIL_FROM=${{ vars.MAIL_FROM }}" \
            --set-env-vars "MAIL_QUEUE_ENABLED=${{ vars.MAIL_QUEUE_ENABLED }}" \
            --set-env-vars "MAIL_QUEUE_LOCATION=${{ vars.GCP_REGION }}" \
            --set-env-vars "MAIL_QUEUE_NAME=${{ vars.MAIL_QUEUE_NAME }}" \
            --set-env-vars "MAIL_QUEUE_HANDLER_URL=${{ vars.MAIL_QUEUE_HANDLER_URL }}" \
            --set-env-vars "MAIL_QUEUE_SERVICE_ACCOUNT=${{ vars.MAIL_QUEUE_SERVICE_ACCOUNT }}" \
            --set-env-vars "LEGAL_TERMS_VERSION=${{ vars.LEGAL_TERMS_VERSION }}" \
            --set-env-vars "LEGAL_PRIVACY_VERSION=${{ vars.LEGAL_PRIVACY_VERSION }}" \
            --set-env-vars "STORAGE_PROVIDER=${{ vars.STORAGE_PROVIDER }}" \
            --set-env-vars "STORAGE_PUBLIC_BASE_URL=${{ vars.STORAGE_PUBLIC_BASE_URL }}" \
            --set-env-vars "STORAGE_PUBLIC_BUCKET=${{ vars.STORAGE_PUBLIC_BUCKET }}" \
            --set-env-vars "STORAGE_RESTRICTED_BUCKET=${{ vars.STORAGE_RESTRICTED_BUCKET }}" \
            --set-env-vars "VERIFICATION_REVIEW_DAYS=${{ vars.VERIFICATION_REVIEW_DAYS || 2 }}" \
            --set-env-vars "^;^SECURITY_BOOTSTRAP_MODERATORS=${{ vars.SECURITY_BOOTSTRAP_MODERATORS }}" \
            --set-env-vars "FEATURE_SELLER_VERIFICATION=${{ vars.FEATURE_SELLER_VERIFICATION || 'false' }}" \
            --set-env-vars "FEATURE_PUBLISHING=${{ vars.FEATURE_PUBLISHING || 'false' }}" \
            --set-env-vars "FEATURE_CATALOG=${{ vars.FEATURE_CATALOG || 'false' }}" \
            --set-secrets "DB_URL=sendik-db-url:latest" \
            --set-secrets "DB_USERNAME=sendik-db-username:latest" \
            --set-secrets "DB_PASSWORD=sendik-db-password:latest" \
            --set-secrets "JWT_SECRET=sendik-jwt-secret:latest" \
            --set-secrets "JWT_ISSUER=sendik-jwt-issuer:latest" \
            --set-secrets "MAIL_PROVIDER_API_KEY=sendik-mail-api-key:latest" \
            --set-secrets "CRYPTO_DATA_KEY_V1=sendik-crypto-data-key-v1:latest" \
            --set-secrets "CRYPTO_LOOKUP_KEY=sendik-crypto-lookup-key:latest"

      # Que el despliegue termine sin error no significa que la aplicación
      # responda: comprobarlo aquí es lo que convierte un despliegue roto en un
      # trabajo rojo en lugar de en un descubrimiento del día siguiente.
      - name: Comprobar que responde
        run: |
          DIRECCION=$(gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE }} \
            --region ${{ vars.GCP_REGION }} --format 'value(status.url)')
          echo "Comprobando $DIRECCION/actuator/health"
          for intento in $(seq 1 20); do
            if curl --fail --silent --show-error "$DIRECCION/actuator/health" > /dev/null; then
              echo "Responde."
              exit 0
            fi
            sleep 5
          done
          echo "No respondió tras 100 segundos."
          exit 1

  frontend:
    name: Frontend en Cloud Run
    needs: [verificar, destino]
    # Se omite mientras no haya proyecto de Google Cloud configurado, por lo mismo
    # que el backend: una canalización que está roja siempre deja de leerse.
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.destino.outputs.entorno }}

    steps:
      - uses: actions/checkout@v7

      - name: Autenticarse en Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Preparar el acceso a Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Construir y publicar la imagen
        env:
          IMAGEN: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sendik/frontend
        run: |
          docker build -t "$IMAGEN:${{ needs.destino.outputs.etiqueta }}" frontend
          docker push "$IMAGEN:${{ needs.destino.outputs.etiqueta }}"

      # La configuración va por variables de entorno y no compilada dentro del
      # paquete: el mismo artefacto sirve para dev y para prod, y cambiar la
      # dirección de la API no exige volver a construir (ADR-0019).
      #
      # Ninguna es secreta. El frontend solo recibe lo que el sitio dice en voz
      # alta —las cifras que anuncia, los datos de la empresa, las versiones de los
      # legales— y la dirección de la API. Nada que no pueda leer cualquiera que
      # abra el navegador, y por eso aquí no hay `--set-secrets`.
      #
      # `APP_API_BASE_URL` cambia de nombre a `API_BASE_URL` porque asi lo lee
      # `read-app-config.ts`. Es el mismo valor que recibe el backend, declarado una
      # sola vez, y lleva el prefijo `/api/v1`: el frontend cuelga las rutas de ahi
      # sin agregar nada.
      - name: Desplegar la revisión
        env:
          IMAGEN: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sendik/frontend
        run: |
          gcloud run deploy ${{ vars.CLOUD_RUN_WEB_SERVICE }} \
            --image "$IMAGEN:${{ needs.destino.outputs.etiqueta }}" \
            --region ${{ vars.GCP_REGION }} \
            --platform managed \
            --port 4000 \
            --min-instances ${{ vars.CLOUD_RUN_WEB_MIN_INSTANCES }} \
            --max-instances ${{ vars.CLOUD_RUN_WEB_MAX_INSTANCES }} \
            --memory ${{ vars.CLOUD_RUN_WEB_MEMORY }} \
            --service-account ${{ vars.CLOUD_RUN_WEB_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --set-env-vars "API_BASE_URL=${{ vars.APP_API_BASE_URL }}" \
            --set-env-vars "^;^NG_ALLOWED_HOSTS=${{ vars.NG_ALLOWED_HOSTS }}" \
            --set-env-vars "DEFAULT_LOCALE=${{ vars.DEFAULT_LOCALE }}" \
            --set-env-vars "^;^AVAILABLE_LOCALES=${{ vars.AVAILABLE_LOCALES }}" \
            --set-env-vars "^;^COMPANY_NAME=${{ vars.COMPANY_NAME }}" \
            --set-env-vars "COMPANY_TAX_ID=${{ vars.COMPANY_TAX_ID }}" \
            --set-env-vars "^;^COMPANY_ADDRESS=${{ vars.COMPANY_ADDRESS }}" \
            --set-env-vars "SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}" \
            --set-env-vars "COMMISSION_RATE=${{ vars.COMMISSION_RATE }}" \
            --set-env-vars "CLAIM_WINDOW_DAYS=${{ vars.CLAIM_WINDOW_DAYS }}" \
            --set-env-vars "VERIFICATION_REVIEW_DAYS=${{ vars.VERIFICATION_REVIEW_DAYS || 2 }}" \
            --set-env-vars "LISTING_REVIEW_DAYS=${{ vars.LISTING_REVIEW_DAYS || 2 }}" \
            --set-env-vars "LEGAL_TERMS_VERSION=${{ vars.LEGAL_TERMS_VERSION }}" \
            --set-env-vars "LEGAL_PRIVACY_VERSION=${{ vars.LEGAL_PRIVACY_VERSION }}" \
            --set-env-vars "LEGAL_COOKIES_VERSION=${{ vars.LEGAL_COOKIES_VERSION }}"

      # Que el despliegue termine sin error no significa que el sitio responda.
      # Aquí se pide la portada y no una sonda: es la ruta que de verdad renderiza,
      # así que un fallo del servidor de SSR sale a la luz ahora y no cuando entre
      # alguien.
      # Un 200 no basta, y costó una tarde averiguarlo. `@angular/ssr` renuncia al
      # renderizado en servidor si recibe una cabecera `x-forwarded-*` que no esté
      # declarada como confiable, y entrega la página de renderizado en cliente: raíz
      # vacía, sin estado transferido y estado 200. La comprobación anterior la daba
      # por buena y el sitio quedaba en blanco para todo el mundo.
      #
      # Se pide por la dirección de `run.app`, que pasa por el proxy de Google y por
      # tanto trae la cabecera: es el mismo camino que recorre un visitante.
      - name: Comprobar que responde
        run: |
          DIRECCION=$(gcloud run services describe ${{ vars.CLOUD_RUN_WEB_SERVICE }} \
            --region ${{ vars.GCP_REGION }} --format 'value(status.url)')
          echo "Comprobando $DIRECCION"
          RESPONDIO=no
          for intento in $(seq 1 20); do
            if curl --fail --silent --show-error "$DIRECCION/" > portada.html; then
              echo "Responde."
              RESPONDIO=si
              break
            fi
            sleep 5
          done
          if [ "$RESPONDIO" = no ]; then
            echo "No respondió tras 100 segundos."
            exit 1
          fi

          # La raíz vacía es la firma exacta del renderizado en cliente.
          if grep -q '<sendik-root></sendik-root>' portada.html; then
            echo "::error::Respondió 200 pero la página llegó SIN renderizar: <sendik-root> viene vacía."
            echo "Es el fallo de trustProxyHeaders de frontend/src/server.ts. Sin renderizado"
            echo "en servidor no hay estado transferido, APP_CONFIG no llega y la aplicación"
            echo "no arranca en el navegador: página en blanco (ADR-0006, ADR-0021)."
            exit 1
          fi

          # Y la comprobación en positivo: el estado transferido solo existe si de
          # verdad se renderizó en el servidor.
          if ! grep -q 'ng-state' portada.html; then
            echo "::error::Respondió 200 y con marcado, pero sin estado transferido."
            echo "APP_CONFIG viaja ahí y sin él la aplicación no arranca (ADR-0021)."
            exit 1
          fi

          echo "Renderizada en servidor y con estado transferido."
