# Compila, prueba y analiza las dos mitades del monorepo.
#
# Se ejecuta en cada pull request y en cada integracion a main. No hay filtros
# por carpeta a proposito: con dos mitades que se hablan por un contrato, un
# cambio en docs/ que toque el contrato de la API deberia poder romper algo, y
# saltarse la verificacion por la ruta del archivo es como se cuelan esos casos.
#
# Aqui no se despliega nada: el despliegue vive en despliegue.yml, que llama a
# esta como paso previo obligatorio (`workflow_call`). Esa es la razon de que sea
# reutilizable: si el despliegue repitiera los pasos por su cuenta, los dos
# archivos se irian separando y llegaria el dia en que se despliega algo que paso
# una verificacion mas floja que la de los pull request.

name: Verificación

on:
  pull_request:
  push:
    branches: [main]
  # Para que despliegue.yml la exija antes de publicar nada.
  workflow_call:

# Solo lectura: esta canalizacion no escribe en el repositorio.
permissions:
  contents: read

# Un empujon nuevo cancela la verificacion anterior de la misma rama: no tiene
# sentido gastar minutos en un commit que ya quedo atras.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # El JDK se instala aqui en lugar de dejar que lo descargue el toolchain
      # de Gradle: es el mismo Temurin 25 y ahorra la descarga en cada ejecucion.
      # La version sale de backend/gradle/libs.versions.toml.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # `check` es compilar, formato con Spotless, las doce reglas de
      # arquitectura de ArchUnit, las pruebas con Testcontainers y el minimo de
      # cobertura. Docker ya viene en el runner, que es lo que necesita
      # Testcontainers para levantar PostgreSQL.
      - name: Verificar
        run: ./gradlew check

      - name: Publicar informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informes-backend
          path: backend/*/build/reports/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # En pasos separados y no con `npm run verify` para que, cuando falle, la
      # interfaz diga cual de los tres fue sin abrir el registro.
      - name: Linter y formato
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      # Comprueban el HTML que sale del servidor, sin ejecutar JavaScript: es la
      # unica forma de demostrar lo que promete ADR-0006.
      - name: Pruebas de extremo a extremo
        run: npm run e2e

      - name: Publicar informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informes-frontend
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # Las dos mitades juntas: backend real, PostgreSQL real y navegador real.
  #
  # Es un trabajo aparte de `frontend` y no un paso mas dentro, porque cuando algo
  # se rompe importa muchisimo saber si se rompio el renderizado del servidor o el
  # contrato entre las dos mitades. Y porque necesita Java y una base de datos:
  # meterlo en el trabajo del frontend obligaria a instalar todo eso para correr
  # unas pruebas que no lo necesitan.
  #
  # Cubre lo que docs/arquitectura/pruebas.md y las pruebas requeridas de HU-001
  # pedian y no existia: registro, verificacion, ingreso, cierre y recuperacion de
  # punta a punta. Antes estaban probados por mitades y ninguna mitad podia ver un
  # contrato roto entre las dos.
  extremo-a-extremo:
    name: Extremo a extremo completo
    runs-on: ubuntu-latest
    # Sube de 30 desde que la suite corre dos veces y una de sus pruebas llena la cola
    # con veintiuna solicitudes por la interfaz. Con margen: un corredor lento no debe
    # producir un fallo que se lee como una prueba rota.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sendik
          POSTGRES_USER: sendik
          POSTGRES_PASSWORD: sendik
        ports:
          - 5432:5432
        # Sin esto, el backend arranca antes que la base y Flyway falla por una
        # causa que no es la real.
        options: >-
          --health-cmd "pg_isready -U sendik -d sendik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # El artefacto empaquetado, el mismo que se lleva la imagen de Cloud Run.
      # `bootJar` no arrastra `test`: las pruebas ya corrieron en el trabajo
      # `backend` y aqui no se excluye nada, simplemente esta tarea no las incluye.
      - name: Empaquetar el backend
        working-directory: backend
        run: ./gradlew :bootstrap:bootJar

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar el frontend
        working-directory: frontend
        run: npm run build

      - name: Instalar navegador
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo completas, primera vuelta
        working-directory: frontend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/sendik
          DB_USERNAME: sendik
          DB_PASSWORD: sendik
        run: npm run e2e:completo

      # La segunda vuelta, contra la base que dejo la primera y sin volver a
      # levantarla. **Es lo unico que comprueba de verdad que la suite se puede repetir**,
      # que es una propiedad que esta suite dice tener y que nada verificaba: hasta ahora
      # cada ejecucion empezaba con la base recien creada, asi que un caso que solo falla
      # cuando ya hay datos de antes -una cola que arrastra pendientes, una cuenta de
      # moderadora que ya existe, un documento ya registrado- pasaba desapercibido arriba
      # y solo aparecia en local, que es exactamente al reves de lo que conviene.
      #
      # Es la misma orden y el mismo contenedor de PostgreSQL: el servicio vive lo que
      # dura el trabajo, y Playwright levanta y apaga sus servidores en cada llamada.
      - name: Pruebas de extremo a extremo completas, segunda vuelta
        working-directory: frontend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/sendik
          DB_USERNAME: sendik
          DB_PASSWORD: sendik
        run: npm run e2e:completo

      # El registro del backend incluido: cuando una de estas pruebas falla, casi
      # siempre la causa esta ahi y no en la captura del navegador.
      #
      # **Siempre, y no solo cuando el trabajo falla.** Una prueba intermitente falla y
      # pasa al reintentar, asi que el trabajo termina en verde y con `if: failure()` sus
      # trazas no se subian: quedaba constancia de que hubo un intermitente y ninguna
      # forma de saber por que. Paso con el guardado del envio y costo una corrida entera
      # descubrir que no habia nada que mirar.
      #
      # Playwright ya graba la traza del primer reintento -`trace: 'on-first-retry'`- asi
      # que el material existe; lo unico que faltaba era subirlo. En una corrida limpia el
      # artefacto es el registro del backend y poco mas.
      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes-extremo-a-extremo
          # Sin esto el registro del backend no viaja: upload-artifact v4 ignora los
          # archivos ocultos, y `.registro-backend.log` empieza por punto. El artefacto
          # se subia sin el, que es justo lo que hace falta cuando una de estas pruebas
          # falla por un 500 del servidor y la captura del navegador solo muestra el
          # aviso generico.
          include-hidden-files: true
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e-completo/.registro-backend.log
          retention-days: 7

  # El despliegue ensayado, sin desplegar nada.
  #
  # `despliegue.yml` solo corre al integrar a `main`, asi que hasta ahora un
  # Dockerfile roto o una variable olvidada se descubrian **despues** de integrar, y
  # ademas en un flujo cuyos dos trabajos se omiten mientras no haya proyecto de
  # Google Cloud: la senal no existia en ninguna parte. Aqui se hace lo unico de ese
  # flujo que no necesita cuenta de nube, que resulta ser lo que mas se rompe:
  # construir las dos imagenes y comprobar que arrancan y responden.
  #
  # **Con el perfil `dev` y no con `local`, y ahi esta la mitad del valor.** `local`
  # trae valor por omision para todo, asi que una variable que falte en el despliegue
  # arrancaria igual aqui y el ensayo mentiria. `dev` no tiene ninguno: si a
  # `despliegue.yml` le falta una variable obligatoria, el contenedor no levanta y
  # este trabajo se pone rojo. Es exactamente lo que pasaba con las dos claves de
  # cifrado, documentadas como obligatorias en docs/operacion/configuracion.md y que
  # no pasaba nadie: el despliegue a dev habria muerto al arrancar.
  #
  # Por eso los nombres de las variables de abajo son los mismos que los de
  # `despliegue.yml`, uno a uno. Si alli se agrega una, aqui tambien.
  #
  # Los valores no son secretos ni lo parecen: la base de datos es el servicio de
  # PostgreSQL de este trabajo, el almacen es el sistema de archivos y las claves se
  # generan al vuelo y mueren con el runner. Nada sale a la red: una sonda de estado
  # y la portada no mandan ningun correo.
  ensayo-del-despliegue:
    name: Ensayo del despliegue
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sendik
          POSTGRES_USER: sendik
          POSTGRES_PASSWORD: sendik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sendik -d sendik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Las mismas ordenes que ejecuta el despliegue, con el mismo contexto de
      # construccion. Lo que aqui no construya, alli tampoco.
      #
      # Y con las tres banderas de la Fase 2 encendidas, que es la forma que tiene `dev`.
      # Con ellas apagadas este ensayo no construia ni un solo bean de verificacion, de
      # publicacion ni de catalogo: arrancaba un backend mucho mas pequeno que el que se
      # despliega, y una variable que faltara solo para esos beans no se veia aqui.
      - name: Construir la imagen del backend
        run: docker build -t sendik-backend:ensayo backend

      - name: Construir la imagen del frontend
        run: docker build -t sendik-frontend:ensayo frontend

      # `--network host` para que el contenedor alcance el PostgreSQL del servicio en
      # localhost, y para que su puerto quede accesible desde los pasos siguientes sin
      # publicar nada.
      #
      # Las variables van en la misma forma que las pasa el despliegue, vacías incluidas.
      # No basta con omitir las que no se usan: una variable sin definir y una definida y
      # vacía no significan lo mismo, y el 6 de septiembre de 2026 la revisión murió por
      # una `MAIL_QUEUE_ENABLED` vacía que aquí, al no pasarse, nunca se probó.
      - name: Arrancar el backend y esperar a que responda
        run: |
          docker run -d --name backend --network host \
            -e SPRING_PROFILES_ACTIVE=dev \
            -e PORT=8080 \
            -e DB_URL=jdbc:postgresql://localhost:5432/sendik \
            -e DB_USERNAME=sendik \
            -e DB_PASSWORD=sendik \
            -e APP_BASE_URL=http://localhost:4000 \
            -e APP_API_BASE_URL=http://localhost:8080/api/v1 \
            -e CORS_ALLOWED_ORIGINS=http://localhost:4000 \
            -e SUPPORT_EMAIL=soporte@example.test \
            -e COMPANY_NAME=Sendik \
            -e COMPANY_TAX_ID=000000000-0 \
            -e "COMPANY_ADDRESS=Medellin, Colombia" \
            -e COMMISSION_RATE=0.05 \
            -e MAIL_PROVIDER=resend \
            -e MAIL_FROM=no-responder@example.test \
            -e MAIL_PROVIDER_API_KEY=sin-clave-en-el-ensayo \
            -e MAIL_QUEUE_ENABLED=false \
            -e MAIL_QUEUE_LOCATION=us-east1 \
            -e MAIL_QUEUE_NAME= \
            -e MAIL_QUEUE_HANDLER_URL= \
            -e MAIL_QUEUE_SERVICE_ACCOUNT= \
            -e LEGAL_TERMS_VERSION=ensayo \
            -e LEGAL_PRIVACY_VERSION=ensayo \
            -e STORAGE_PROVIDER=local \
            -e STORAGE_PUBLIC_BASE_URL=http://localhost:8080/archivos \
            -e JWT_ISSUER=http://localhost:8080 \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e CRYPTO_DATA_KEY_V1="$(openssl rand -base64 32)" \
            -e CRYPTO_LOOKUP_KEY="$(openssl rand -base64 32)" \
            -e VERIFICATION_REVIEW_DAYS=2 \
            -e SECURITY_BOOTSTRAP_MODERATORS=ensayo@example.test \
            -e FEATURE_SELLER_VERIFICATION=true \
            -e FEATURE_PUBLISHING=true \
            -e FEATURE_CATALOG=true \
            sendik-backend:ensayo

          # La misma sonda que usa el despliegue. Flyway migra al arrancar, asi que
          # esperar a que responda es tambien esperar a que el esquema entero se
          # aplique sobre un PostgreSQL 17 limpio: una migracion nueva que no corra
          # sale aqui.
          for intento in $(seq 1 40); do
            if curl --fail --silent --show-error http://localhost:8080/actuator/health > /dev/null; then
              echo "El backend responde."
              exit 0
            fi
            sleep 5
          done
          echo "No respondio tras 200 segundos."
          exit 1

      # Contra el backend recien arrancado, que es como se sirve de verdad: el
      # renderizado en servidor pinta la portada en el servidor, asi que esto
      # ejercita las dos imagenes juntas y no cada una por su lado.
      - name: Arrancar el frontend y esperar a que responda
        run: |
          docker run -d --name frontend --network host \
            -e PORT=4000 \
            -e API_BASE_URL=http://localhost:8080/api/v1 \
            -e NG_ALLOWED_HOSTS=localhost \
            -e DEFAULT_LOCALE=es \
            -e AVAILABLE_LOCALES=es,en \
            -e COMPANY_NAME=Sendik \
            -e COMPANY_TAX_ID=000000000-0 \
            -e "COMPANY_ADDRESS=Medellin, Colombia" \
            -e SUPPORT_EMAIL=soporte@example.test \
            -e COMMISSION_RATE=0.05 \
            -e CLAIM_WINDOW_DAYS=5 \
            -e VERIFICATION_REVIEW_DAYS=2 \
            -e LISTING_REVIEW_DAYS=2 \
            -e LEGAL_TERMS_VERSION=ensayo \
            -e LEGAL_PRIVACY_VERSION=ensayo \
            -e LEGAL_COOKIES_VERSION=ensayo \
            sendik-frontend:ensayo

          # La portada y no una sonda, igual que en el despliegue: es la ruta que de
          # verdad renderiza, asi que un fallo del servidor de SSR sale a la luz ahora
          # y no cuando entre alguien.
          for intento in $(seq 1 24); do
            if curl --fail --silent --show-error http://localhost:4000/ > /dev/null; then
              echo "El frontend responde."
              exit 0
            fi
            sleep 5
          done
          echo "No respondio tras 120 segundos."
          exit 1

      # Cuando uno de los dos no levanta, la causa esta siempre en el registro del
      # contenedor y nunca en la salida del paso, que solo dice que se agoto la espera.
      - name: Publicar el registro de los contenedores si algo falla
        if: failure()
        run: |
          for contenedor in backend frontend; do
            echo "::group::$contenedor"
            docker logs "$contenedor" 2>&1 || echo "El contenedor no llego a existir."
            echo "::endgroup::"
          done
