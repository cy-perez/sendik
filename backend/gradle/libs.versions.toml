# Fuente unica de verdad de las versiones del backend (ADR-0002).
# Nunca se escribe una version suelta en un build.gradle.kts.
#
# Dos grupos:
#   1. Lo que gestiona el BOM de Spring Boot va SIN version aqui. La plataforma
#      la fija, y asi no hay dos numeros que mantener sincronizados.
#   2. Lo que vive fuera del mundo Spring (dominio y pruebas puras) si lleva
#      version, porque `domain` no aplica el BOM: no puede.
#
# Las versiones del grupo 2 estan alineadas a proposito con las que gestiona
# Spring Boot 4.1.0, para que no aparezcan dos versiones de JUnit en el mismo
# classpath cuando un modulo Spring y `domain` se prueban juntos.

[versions]
java = "25"
spring-boot = "4.1.1"
springdoc = "3.1.0"
jspecify = "1.0.1"
junit = "6.1.3"
assertj = "3.27.7"
mockito = "5.23.0"
archunit = "1.5.0"
jacoco = "0.8.15"
spotless = "8.10.1"
bouncycastle = "1.85.2"
google-cloud-storage = "2.72.0"
google-cloud-tasks = "2.96.0"
palantir-java-format = "2.97.0"

[libraries]

# --- Plataformas: solo fijan versiones, no aportan una sola clase ------------
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

# --- domain: lo unico que se le permite ------------------------------------
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

# --- application: solo esto de todo Spring ---------------------------------
spring-tx = { module = "org.springframework:spring-tx" }

# --- infrastructure --------------------------------------------------------
spring-boot-starter-data-jdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
# Solo el modulo de criptografia, no el starter completo: infrastructure hashea
# contrasenas, no configura filtros HTTP. La version la fija el BOM.
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }

# Solo para RestClient: los adaptadores de Resend y de Have I Been Pwned salen a
# la red. No es el starter web, que traeria el servidor y el stack de MVC a un
# modulo que no atiende ninguna peticion.
spring-web = { module = "org.springframework:spring-web" }

# El convertidor JSON que RestClient necesita para serializar el cuerpo que se le
# manda a Resend. Va aqui y no se hereda de nadie: `infrastructure` lo usaba sin
# declararlo y funcionaba solo porque `presentation` arrastra Jackson con su
# starter de webmvc. Si presentation cambiara de starter, ResendMailSender dejaria
# de poder serializar y **no se notaria**, porque enviar() se traga la excepcion y
# solo la registra: todos los correos transaccionales dejarian de salir con el
# build en verde. Es el starter de JSON, no el de web: no trae servidor ni MVC.
spring-boot-starter-json = { module = "org.springframework.boot:spring-boot-starter-json" }

# Emision y lectura del token de acceso con HS256 (ADR-0003). Aporta JwtEncoder,
# JwtDecoder y Nimbus JOSE por debajo. La version la fija el BOM.
spring-security-oauth2-jose = { module = "org.springframework.security:spring-security-oauth2-jose" }

# Argon2PasswordEncoder lo exige explicitamente y el BOM de Spring Boot no
# gestiona su version, asi que va fijada aqui. El hash de almacenamiento es
# Argon2id (docs/arquitectura/modelo-datos.md).
bouncycastle-provider = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

# Cloud Storage, los dos almacenes de archivos (ADR-0018). Aprobada el 21 de agosto
# de 2026. Entra detras de dos puertos, asi que cambiar de proveedor es escribir
# otro adaptador y no tocar ningun caso de uso.
#
# Version fijada aqui porque el BOM de Spring Boot no gestiona las librerias de
# Google. Se usa el artefacto solo, sin el libraries-bom de GCP: es la unica que se
# necesita, y una plataforma entera para una dependencia arrastra la version de
# decenas que no estan.
google-cloud-storage = { module = "com.google.cloud:google-cloud-storage", version.ref = "google-cloud-storage" }

# Cloud Tasks, la cola por la que sale el correo transaccional. Aprobada el 5 de
# septiembre de 2026 en ADR-0031, que explica por que una cola y no las otras dos
# salidas. Es la segunda dependencia de nube del backend -la linea de arriba decia
# "la unica" y dejo de ser cierta aqui- y entra con la misma condicion: detras del
# puerto MailTransport, de modo que cambiar Cloud Tasks por Pub/Sub o por una tabla
# de salida es escribir otro adaptador.
#
# Version fijada a mano por lo mismo que la anterior: el BOM de Spring Boot no
# gestiona las librerias de Google, y se usa el artefacto solo, sin el
# libraries-bom de GCP.
google-cloud-tasks = { module = "com.google.cloud:google-cloud-tasks", version.ref = "google-cloud-tasks" }

# --- presentation ----------------------------------------------------------
# El starter monolitico spring-boot-starter no se usa: en Boot 4 cada pieza
# tiene el suyo (backend/CLAUDE.md).
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# El borde HTTP es quien declara que rutas quedan abiertas, asi que el filtro de
# seguridad vive aqui (ADR-0003, backend/CLAUDE.md).
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }

# La DSL oauth2ResourceServer, con la que el borde valida el JWT en cada peticion.
# Se prefiere a un filtro propio: la extraccion del bearer, el 401 con
# WWW-Authenticate y el contexto de seguridad ya estan resueltos (ADR-0003).
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }

spring-security-test = { module = "org.springframework.security:spring-security-test" }

# --- bootstrap -------------------------------------------------------------
spring-boot-starter-base = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# --- pruebas ---------------------------------------------------------------
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }

# --- solo para buildSrc: el artefacto del plugin, no el plugin --------------
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
