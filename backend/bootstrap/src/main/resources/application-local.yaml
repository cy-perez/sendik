# Desarrollo en la maquina de quien programa.
#
# Los valores por omision permiten arrancar sin .env contra el PostgreSQL del
# docker compose. Ninguno es real ni sirve fuera de localhost: el NIT es un
# marcador de posicion y el correo no existe. Los valores reales, incluso los no
# secretos, llegan por variable de entorno tambien aqui.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sendik}
    username: ${DB_USERNAME:sendik}
    password: ${DB_PASSWORD:sendik}

logging:
  level:
    co.sendik: DEBUG

management:
  endpoints:
    web:
      exposure:
        # flyway responde que migraciones se aplicaron y cuando. En produccion no
        # se expone: dice demasiado sobre el esquema.
        include: health,info,flyway

sendik:
  app:
    base-url: ${APP_BASE_URL:http://localhost:4200}
    api-base-url: ${APP_API_BASE_URL:http://localhost:8080}
    support-email: ${SUPPORT_EMAIL:soporte@localhost}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  company:
    name: ${COMPANY_NAME:Sendik}
    tax-id: ${COMPANY_TAX_ID:000000000-0}
    address: ${COMPANY_ADDRESS:Medellin, Colombia}
  client-ip:
    # Sin proxy delante: la cabecera se ignora y la direccion sale de la conexion.
    # Cualquier `X-Forwarded-For` que llegue aqui lo habria puesto quien llama.
    trusted-hops: ${CLIENT_IP_TRUSTED_HOPS:0}
  commission:
    rate: ${COMMISSION_RATE:0.05}
  session:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    # Clave de desarrollo, no un secreto: esta en el repositorio y por eso mismo no
    # sirve para nada fuera de localhost. En dev y prod la variable es obligatoria y
    # sin ella la aplicacion no arranca.
    secret: ${JWT_SECRET:clave-de-desarrollo-solo-para-localhost-32+}
    cookie:
      # En localhost el navegador acepta cookies Secure incluso por HTTP, pero no
      # las acepta si se sirve desde una IP de la red local. Se apaga aqui para que
      # probar desde el movil contra el portatil no exija montar TLS.
      secure: ${SESSION_COOKIE_SECURE:false}
  mail:
    # En local no sale ningun correo: el enlace de verificacion se imprime en el
    # registro de la aplicacion. Asi HU-001 se recorre entera sin credenciales.
    provider: ${MAIL_PROVIDER:console}
    from: ${MAIL_FROM:no-responder@localhost}
    provider-api-key: ${MAIL_PROVIDER_API_KEY:sin-clave-en-local}
  storage:
    # En local los archivos van al sistema de archivos, como el correo va al
    # registro: asi el criterio 21 se recorre entero sin credenciales de ningun
    # proveedor.
    provider: ${STORAGE_PROVIDER:local}
    local-path: ${STORAGE_LOCAL_PATH:./archivos-locales}
    # Apunta al backend porque en local nadie mas sirve esa carpeta. En la nube es
    # el dominio del CDN.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/archivos}
  crypto:
    # Claves de desarrollo, no secretos: estan en el repositorio y por eso mismo no
    # sirven para nada fuera de localhost. En dev y prod las dos variables son
    # obligatorias y sin ellas la aplicacion no arranca.
    data-keys:
      1: ${CRYPTO_DATA_KEY_V1:c2FzdHJhLWRlc2Fycm9sbG8tZGF0b3MtY2xhdmUtMzI=}
    current-version: ${CRYPTO_CURRENT_KEY_VERSION:1}
    lookup-key: ${CRYPTO_LOOKUP_KEY:c2FzdHJhLWRlc2Fycm9sbG8tYnVzcXVlZGEtY2x2MzI=}
  legal:
    terms-version: ${LEGAL_TERMS_VERSION:borrador-local}
    privacy-version: ${LEGAL_PRIVACY_VERSION:borrador-local}
