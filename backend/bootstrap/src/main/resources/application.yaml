# Configuracion base, comun a todos los perfiles.
#
# Ningun secreto y ningun valor de negocio vive aqui: todo llega por variable de
# entorno (docs/operacion/configuracion.md). Las variables sin valor por omision
# son obligatorias a proposito: si falta una, la aplicacion no arranca. Es
# preferible fallar al iniciar que descubrirlo en produccion.
#
# El perfil se elige con SPRING_PROFILES_ACTIVE: local, dev o prod.

spring:
  application:
    name: sendik
  servlet:
    multipart:
      # **Sin esto rige el 1MB por omision de Spring Boot**, y con el 1MB el tope de
      # verdad —STORAGE_MAX_IMAGE_BYTES, 8MB— es inalcanzable: la peticion muere en el
      # resolvedor multipart antes de que ninguna politica de imagen la mire. Una foto
      # de telefono recortada a 3:4 pasa de 1MB casi siempre, asi que subir una toma
      # fallaba con un 500 que nadie podia explicar.
      #
      # Va por encima del tope de la imagen para dejar sitio a la envoltura del
      # multipart. Quien decide si el archivo es aceptable sigue siendo ImagePolicy;
      # esto solo evita que el servidor se coma un cuerpo enorme antes de mirarlo.
      max-file-size: ${STORAGE_MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${STORAGE_MAX_UPLOAD_SIZE:10MB}
  config:
    # El .env de la raiz del repositorio, si existe. En la nube no existe: alli
    # los valores llegan del gestor de secretos como variables de entorno.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      # El esquema lo define exclusivamente Flyway (docs/arquitectura/modelo-datos.md).
      mode: never

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    # Un error nunca revela rutas internas ni trazas de excepcion
    # (docs/arquitectura/contrato-api.md).
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

sendik:
  app:
    base-url: ${APP_BASE_URL}
    api-base-url: ${APP_API_BASE_URL}
    support-email: ${SUPPORT_EMAIL}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
    # Zona con la que se calculan las fechas de negocio, RN-008 incluida.
    time-zone: ${APP_TIME_ZONE:America/Bogota}
  company:
    name: ${COMPANY_NAME}
    tax-id: ${COMPANY_TAX_ID}
    address: ${COMPANY_ADDRESS}
  commission:
    rate: ${COMMISSION_RATE}
  session:
    # Las variables se llaman JWT_* porque asi estan publicadas en
    # docs/operacion/configuracion.md y en .env.example. Los cuatro valores son
    # obligatorios: una clave de firma por omision seria una clave conocida.
    issuer: ${JWT_ISSUER}
    secret: ${JWT_SECRET}
    # RN-007: 15 minutos y 30 dias.
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
    # Ventana de gracia de RN-007. Cubre una carrera entre dos peticiones del
    # mismo navegador, que dura una ida y vuelta, no mas. Subirla a minutos le
    # regalaria a un token robado ese mismo tiempo para reproducirse sin que
    # salte la deteccion de reutilizacion; ponerla en cero devuelve el
    # comportamiento anterior a ADR-0014, con sus falsos incidentes.
    refresh-grace: ${JWT_REFRESH_GRACE:PT10S}
    cookie:
      name: ${SESSION_COOKIE_NAME:sendik_refresh}
      # Limitada a las rutas de sesion (ADR-0003): el navegador no la manda en
      # ninguna otra peticion.
      path: ${SESSION_COOKIE_PATH:/api/v1/auth}
      # Solo se apaga en desarrollo detras de HTTP sin cifrar. En la nube, nunca.
      secure: ${SESSION_COOKIE_SECURE:true}
  rate-limit:
    # Peticiones por origen en las rutas de cuenta. RN-006 protege una cuenta;
    # esto protege el endpoint, que es otra cosa.
    credentials:
      # Escribir credenciales es un acto humano: diez por minuto sobra para
      # cualquiera que se equivoque varias veces y no le sirve a quien quiera
      # probar contrasenas contra muchas cuentas.
      max-requests: ${RATE_LIMIT_CREDENTIALS_MAX:10}
      window: ${RATE_LIMIT_CREDENTIALS_WINDOW:PT1M}
    session:
      # Refrescar lo hace el navegador solo, y con varias pestanas abiertas se
      # dispara mas veces sin que nadie haga nada raro. Por eso es mas holgado.
      max-requests: ${RATE_LIMIT_SESSION_MAX:60}
      window: ${RATE_LIMIT_SESSION_WINDOW:PT1M}
    account:
      # Las rutas de cuenta que exigen sesion, contadas por sujeto del token y no
      # por origen: ahi si hay a quien atribuir la peticion, y contar por IP
      # castigaria a una oficina entera por lo que haga uno.
      #
      # Holgado a proposito. Son lecturas normales de la aplicacion -el panel del
      # vendedor pide dos por cada guardado- y una persona trabajando no se acerca
      # a esto. Lo que corta es el guion que repite una lectura sin freno.
      max-requests: ${RATE_LIMIT_ACCOUNT_MAX:120}
      window: ${RATE_LIMIT_ACCOUNT_WINDOW:PT1M}
    listings:
      # Las rutas de publicacion, contadas por sujeto y con una sola cuenta para
      # todo el grupo, no una por ruta. Lo que se acota es el bucle enviar ->
      # retirar -> enviar, que engorda el rastro de moderacion sin cota y recorre
      # dos URI distintas: una cuenta por ruta le daria el cupo entero a cada
      # mitad del ciclo.
      #
      # Noventa deja pasar de sobra lo que hace una persona publicando: las ocho
      # tomas van en ocho peticiones, y editar, cambiar precio y enviar a revision
      # son unas pocas mas. La ficha publica no entra en esta cuenta, porque sin
      # sesion no hay sujeto al que atribuirla.
      max-requests: ${RATE_LIMIT_LISTINGS_MAX:90}
      window: ${RATE_LIMIT_LISTINGS_WINDOW:PT1M}
    # Techo de origenes en memoria: sin el, variar la IP a voluntad haria crecer
    # el mapa hasta agotarla y la defensa seria la via de ataque.
    max-tracked-keys: ${RATE_LIMIT_MAX_KEYS:50000}
  mail:
    # console imprime el enlace en el registro; resend envia de verdad (ADR-0012).
    provider: ${MAIL_PROVIDER:resend}
    queue:
      # La cola por la que sale el correo (ADR-0031). Apagada por omision para que
      # `local` y las pruebas entreguen en el hilo de la peticion: ahi el proveedor
      # es la consola y no hay red que esperar.
      #
      # Encendida en Cloud Run, y ahi no es opcional: el envio fuera de una peticion
      # muere cuando el contenedor se congela.
      enabled: ${MAIL_QUEUE_ENABLED:false}
      project: ${GCP_PROJECT_ID:}
      location: ${MAIL_QUEUE_LOCATION:}
      queue: ${MAIL_QUEUE_NAME:}
      # Absoluta: quien hace esta peticion es Cloud Tasks desde fuera.
      handler-url: ${MAIL_QUEUE_HANDLER_URL:}
      # La cuenta con la que Cloud Tasks firma, y la misma que el endpoint exige.
      service-account: ${MAIL_QUEUE_SERVICE_ACCOUNT:}
      # Vacia significa la propia handler-url, que es lo que hace Cloud Tasks.
      audience: ${MAIL_QUEUE_AUDIENCE:}
    from: ${MAIL_FROM}
    provider-api-key: ${MAIL_PROVIDER_API_KEY}
    api-url: ${MAIL_API_URL:https://api.resend.com/emails}
    # Ruta del frontend que recibe el enlace. Se concatena a app.base-url.
    verification-path: ${MAIL_VERIFICATION_PATH:/verificar-correo}
    # Criterio 18. Ruta distinta de la verificacion: son dos pantallas y dos
    # tokens con vigencias distintas, 24 horas y 30 minutos.
    password-reset-path: ${MAIL_PASSWORD_RESET_PATH:/restablecer-contrasena}
    # Criterio 21: confirma el correo nuevo antes de reemplazar el anterior.
    email-change-path: ${MAIL_EMAIL_CHANGE_PATH:/confirmar-correo-nuevo}
  storage:
    # local guarda en el sistema de archivos y sirve para desarrollo; gcs es Cloud
    # Storage (ADR-0018). El sistema de archivos de Cloud Run es efimero, asi que
    # `local` en la nube pierde lo guardado con la instancia.
    provider: ${STORAGE_PROVIDER:local}
    # Raiz de los dos almacenes cuando el proveedor es local. Dentro se crean dos
    # carpetas, publica y reservada: son dos almacenes tambien aqui.
    local-path: ${STORAGE_LOCAL_PATH:./archivos-locales}
    # Desde donde se sirven los archivos publicos. No se guarda en la base: si se
    # guardara, cambiar de CDN obligaria a reescribir la tabla.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL}
    # Cloud Run no acepta peticiones de mas de 32MB, asi que subirlo por encima de
    # eso no sirve de nada. 8MB sobra para una imagen 3:4 ya recortada en cliente.
    max-image-bytes: ${STORAGE_MAX_IMAGE_BYTES:8388608}
    # Minimo para la FOTO DE PERFIL, no para las tomas de producto.
    #
    # RN-019 fija 900x1200 y eso es de las tomas de producto (HU-003), no del
    # avatar: aplicarselo rechazaria casi cualquier foto que alguien tenga a mano.
    # Nadie ha decidido un minimo para el avatar, asi que estos 200x200 son un
    # valor de arranque, no una regla de negocio: solo evita que se suba un icono
    # de 16px que se vera borroso en la cabecera. Si se decide una regla, entra en
    # una historia y se anota en reglas-negocio.md.
    avatar-min-width: ${STORAGE_AVATAR_MIN_WIDTH:200}
    avatar-min-height: ${STORAGE_AVATAR_MIN_HEIGHT:200}
    # Minimo para las TOMAS DE PRODUCTO. Esto si es regla de negocio: RN-019 fija
    # 900x1200, y de ahi sale tambien la proporcion 3:4 que exige RN-018.
    #
    # Son parametrizables porque el resto del almacenamiento lo es, no porque se
    # esperen otros valores: bajarlos incumple RN-019. La proporcion no se
    # parametriza, se calcula de estos dos: dos numeros que se pueden contradecir
    # entre si son un error esperando a pasar.
    listing-min-width: ${STORAGE_LISTING_MIN_WIDTH:900}
    listing-min-height: ${STORAGE_LISTING_MIN_HEIGHT:1200}
    # Las tres siguientes son solo de `gcs` y se ignoran con `local`.
    #
    # El proyecto es opcional: sin el, la libreria lo toma de las credenciales, que
    # es lo correcto dentro de Cloud Run. Se declara para poder fijarlo en una
    # maquina donde `gcloud` apunte a otro proyecto.
    project-id: ${STORAGE_PROJECT_ID:}
    # Los dos cubos, y son dos a proposito: el permiso de lectura para allUsers se
    # concede por cubo, asi que un solo cubo para las dos cosas hace publica la
    # cedula de alguien (RN-046, ADR-0018). La aplicacion no arranca si son iguales.
    public-bucket: ${STORAGE_PUBLIC_BUCKET:}
    restricted-bucket: ${STORAGE_RESTRICTED_BUCKET:}
  verification:
    # Dias habiles que se promete tardar en revisar una solicitud de vendedor
    # (criterio 6 de HU-002). Lo dicen la pantalla y el correo, asi que cambiarlo no
    # puede exigir un despliegue. Nadie lo hace cumplir: una solicitud que tarda mas
    # no cambia de estado sola.
    review-days: ${VERIFICATION_REVIEW_DAYS:2}
  crypto:
    # Cifrado de datos sensibles en columna: numero de documento y de cuenta
    # bancaria (RN-046, ADR-0020). Los archivos no pasan por aqui: la cedula y la
    # selfie van al almacen reservado.
    #
    # Un mapa de version a clave, y no una clave sola, para poder rotar sin
    # reescribir la tabla de golpe: las filas viejas siguen diciendo con que
    # version se cifraron, y su clave tiene que seguir aqui mientras exista una
    # fila que la use. Rotar es agregar la version siguiente y mover
    # current-version; retirar la vieja es otro cambio, despues de migrar las
    # filas.
    data-keys:
      1: ${CRYPTO_DATA_KEY_V1}
    current-version: ${CRYPTO_CURRENT_KEY_VERSION:1}
    # Clave del HMAC con el que se compara sin descifrar. TIENE que ser distinta de
    # todas las de cifrado y la aplicacion no arranca si es igual a alguna: si
    # fueran la misma, filtrarla daria las dos capacidades a la vez, descifrar y
    # confirmar adivinaciones. Y adivinar es barato, porque una cedula es un numero
    # de ocho a diez digitos.
    lookup-key: ${CRYPTO_LOOKUP_KEY}
  legal:
    # Version del texto que la persona acepta. Sin ella el consentimiento no se
    # puede demostrar (docs/operacion/datos-personales.md).
    terms-version: ${LEGAL_TERMS_VERSION}
    privacy-version: ${LEGAL_PRIVACY_VERSION}
  password:
    # Contrasenas filtradas con k-anonimato (ADR-0013). Falla abierto.
    breach-check-enabled: ${PASSWORD_BREACH_CHECK_ENABLED:true}
    breach-check-timeout: ${PASSWORD_BREACH_CHECK_TIMEOUT:PT2S}
    breach-check-api-url: ${PASSWORD_BREACH_API_URL:https://api.pwnedpasswords.com/range}
  security:
    # HU-006: quien arranca siendo moderador. Vacia por omision, y vacia no hace nada.
    #
    # Responde a una pregunta que HU-002 dejo abierta: como existe el primer moderador en
    # un entorno nuevo sin que alguien entre a la base de produccion a escribir un INSERT.
    #
    # Concede un rol a cuentas que YA existen. No crea cuentas, no abre sesiones y no
    # salta ninguna comprobacion. Y no revoca: quitar un correo de aqui no le quita el rol
    # a nadie, porque un despliegue con la variable mal puesta degradaria a todos los
    # moderadores en silencio y quedarse sin quien apruebe es peor que un rol de mas.
    moderators: ${SECURITY_BOOTSTRAP_MODERATORS:}
  features:
    # Las seis siguen apagadas. Se enciende cada una cuando su funcionalidad
    # exista, no cuando empiece la fase que la contiene, y se enciende por variable
    # y no por despliegue.
    seller-verification: ${FEATURE_SELLER_VERIFICATION:false}
    publishing: ${FEATURE_PUBLISHING:false}
    # El catalogo publico (HU-009). Es la unica que enciende paginas para quien no
    # tiene cuenta, asi que encenderla es abrir el sitio, no solo una funcionalidad.
    catalog: ${FEATURE_CATALOG:false}
    checkout: ${FEATURE_CHECKOUT:false}
    # La busqueda y los filtros (HU-014). Contra PostgreSQL y no contra Typesense,
    # que queda aplazado detras del mismo puerto (ADR-0035). No enciende ninguna
    # ruta nueva: enciende los parametros de busqueda de la que ya existe.
    search: ${FEATURE_SEARCH:false}
    spin-viewer: ${FEATURE_SPIN_VIEWER:false}
